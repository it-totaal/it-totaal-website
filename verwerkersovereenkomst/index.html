    <script>
      /* Hero-foto: bij elk bezoek wordt hier één foto willekeurig gekozen.
         Dit gebeurt in de <head>, vóór React, zodat de preload hieronder meteen
         de júiste foto met voorrang laadt. Zou de keuze pas in React vallen, dan
         haalt de browser eerst de verkeerde foto binnen: trager en zichtbaar
         geflikker in de hero.

         Elke foto bestaat in 600 en 1200 px. De browser kiest via srcset welke
         hij nodig heeft: 600 op een gewoon scherm, 1200 op retina. Dat scheelt
         niet alleen data — een foto die de browser zelf sterk moet verkleinen
         wordt zichtbaar zachter, en daar is dit precies de oplossing voor.

         Nieuwe foto toevoegen? Zet <naam>-600.webp en <naam>-1200.webp in deze
         map en vul de lijst aan. Verder niets. */
      (function () {
        var fotos = [
          { naam: 'hero-monitoring',      alt: 'Medewerker van IT Totaal bewaakt systemen op een monitoringdashboard' },
          { naam: 'hero-rackontwerp',     alt: 'Medewerker van IT Totaal werkt aan een serverrack-ontwerp' },
          { naam: 'hero-orderverwerking', alt: 'Medewerker van IT Totaal verwerkt orders op kantoor' },
          { naam: 'hero-overleg',         alt: 'Collega\'s van IT Totaal overleggen op de werkvloer' },
          { naam: 'hero-rackstudio',      alt: 'IT-specialist van IT Totaal configureert een serverrack' },
          { naam: 'hero-kantoor',         alt: 'Team van IT Totaal in gesprek op kantoor' },
          { naam: 'hero-teamoverleg',     alt: 'Teamoverleg bij IT Totaal aan de vergadertafel' },
          { naam: 'hero-support',         alt: 'Supportmedewerker van IT Totaal helpt een klant via de headset' }
        ];
        var foto = fotos[Math.floor(Math.random() * fotos.length)];
        var srcset = '/' + foto.naam + '-600.webp 600w, /' + foto.naam + '-1200.webp 1200w';
        var sizes = '(min-width: 1024px) 576px, 92vw';

        window.__heroPhoto = {
          src: '/' + foto.naam + '-1200.webp',
          srcset: srcset,
          sizes: sizes,
          alt: foto.alt
        };

        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = window.__heroPhoto.src;
        link.imageSrcset = srcset;
        link.imageSizes = sizes;
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      })();
    </script>
